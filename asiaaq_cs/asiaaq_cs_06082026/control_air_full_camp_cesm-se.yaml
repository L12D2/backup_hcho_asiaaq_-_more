#-------------------------------------------------------------------
# Model definitions
model:
  cam-chem-se-era5:
    files: /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.era5.GEMSne30x8.2024.01.cam.h5a.*-03600.nc
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/GEMSne30x8/GEMS01_ne30x8_np4_SCRIP.nc"
    radius_of_influence: 200000

    mapping: #model species name : obs species name
      dc8:
        O3: 'O3'
        CO: 'CO'
        NO2: 'NO2'
        T: 'temperature' 
      tropomi_l2_no2:  
        NO2:  'nitrogendioxide_tropospheric_column'
      tropomi_l2_hcho: 
        CH2O: 'formaldehyde_tropospheric_vertical_column'
      tropomi_l2_co:   
        CO: 'carbonmonoxide_total_column'

    projection: ~ 
    plot_kwargs: #Opt 
      color: 'dodgerblue'
      marker: '+'
      linestyle: '-.'

  cam-chem-se-merra2: 
    files: /glade/campaign/acom/acom-weather/emmons/ASIAAQ_sims/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01/atm/hist/f.e3b08.FHISTC_LTt1s.camsm11_finn27.2024.merra2.ne30.01.cam.h4i.*-03600.nc
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne30pg3/ne30pg3_scrip_170611.nc"
    
    radius_of_influence: 200000

    # extra_calc: # Add more complex calculations and their associated variables here.
    #   dewpoint:
    #     pres_calc: "PS"
    #     specific_hum: "Q"
        
    mapping: #model species name : obs species name
      dc8:
        O3: 'O3'
        CO: 'CO'
        NO2: 'NO2'
        T: 'temperature'   
      tropomi_l2_no2:  
        NO2:  'nitrogendioxide_tropospheric_column'
      tropomi_l2_hcho: 
        CH2O: 'formaldehyde_tropospheric_vertical_column'
      tropomi_l2_co:   
        CO: 'carbonmonoxide_total_column'
        
    projection: ~ 
    plot_kwargs: #Opt 
      color: 'magenta'
      marker: 'x'
      linestyle: '--'

      
#-------------------------------------------------------------------
# Observation definitions
obs:
  dc8:
    filename: /glade/campaign/acom/acom-weather/emmons/ASIAAQ_obs/DC8/asiaaq-mrg10_dc8_202402*_RA_*.ict
    obs_type: aircraft
    time_var: Time_Start
    resample: 60s
    variables:
      Latitude_BENNETT:
        rename: latitude
        nan_value: -999999
      Longitude_BENNETT:
        rename: longitude
        nan_value: -999999
      Static_Pressure_BENNETT:
        rename: pressure_obs
        unit_scale: 100
        unit_scale_method: '*'
        nan_value: -999999
      Pressure_Altitude_BENNETT:
        rename: altitude
        unit_scale: 0.3048
        unit_scale_method: '*'
        nan_value: -999999
      Static_Air_Temp_BENNETT:
        rename: temperature
        unit_scale: 273.15
        unit_scale_method: +
        nan_value: -999999
      CO_DACOM_DISKIN:
        rename: CO
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -999999
        LLOD_value: -888888 # Opt Set this value to LLOD_setvalue
        LLOD_setvalue: 0.0
        ylabel_plot: CO (ppb)
        vmin_plot: 0
        vmax_plot: 400
        ty_scale: 1.5
      O3_ppbv:
        rename: O3
        unit_scale: 1              
        unit_scale_method: '*'
        nan_value: -999999
        LLOD_value: -888888 # Opt Set this value to LLOD_setvalue
        LLOD_setvalue: 0.0
        ylabel_plot: O3 (ppb)
        vmin_plot: 0
        vmax_plot: 120
      NO2_pptv:
        rename: NO2
        unit_scale: 0.001          
        unit_scale_method: '*'
        nan_value: -999999
        LLOD_value: -888888 # Opt Set this value to LLOD_setvalue
        LLOD_setvalue: 0.0
        ylabel_plot: NO2 (ppb)
        vmin_plot: 0
        vmax_plot: 30
        
        
  # dc8:
  #   filename: ''
  #   obs_type: aircraft

  #   variables:
  #     pressure_obs: {}
  #     altitude: {}
  #     O3:  {unit_scale: 1,  unit_scale_method: '*' }
  #     CO:  {unit_scale: 1,  unit_scale_method: '*' }
  #     NO2: {unit_scale: 0.001, unit_scale_method: '*' }

  tropomi_l2_no2:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_no2
    regrid_method: conservative
    regrid_target: [model]
    obs_grid_res: 0.1
    obs_grid_extent: [90, 135, 0, 45]
    obs_grid_units: deg
    filename: /glade/campaign/acom/satellite/tropomi/no2/S5P_OFFL_L2__NO2____202402*.nc
    variables:
      qa_value: {}
      nitrogendioxide_tropospheric_column: {ylabel_plot: 'NO$_2$ trop. column (molec cm$^{-2}$)', vmin_plot: 0, vmax_plot: 1.0e+16}
      averaging_kernel: {}
      air_mass_factor_troposphere: {}
      air_mass_factor_total: {}
      tm5_tropopause_pressure: {}
      latitude_bounds: {}
      longitude_bounds: {}
      nitrogendioxide_tropospheric_column_precision: {}
    data_proc:
      filter_dict:
        qa_value: {oper: '>=', value: 0.75}      # NO2 standard

  tropomi_l2_hcho:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_hcho
    regrid_method: conservative
    regrid_target: [model]
    obs_grid_res: 0.1
    obs_grid_extent: [90, 135, 0, 45]
    obs_grid_units: deg
    filename: /glade/campaign/acom/satellite/tropomi/hcho/S5P_OFFL_L2__HCHO___202402*.nc
    variables:
      qa_value: {}
      formaldehyde_tropospheric_vertical_column:
        ylabel_plot: 'HCHO column (molec cm$^{-2}$)'
        vmin_plot: 0.3
        vmax_plot: 2.0e+16
        nlevels_plot: 21
      averaging_kernel: {}
      formaldehyde_tropospheric_air_mass_factor: {}
      surface_pressure: {}
      tm5_constant_a: {}
      tm5_constant_b: {}
      latitude_bounds: {}
      longitude_bounds: {}
      formaldehyde_tropospheric_vertical_column_precision: {}
    data_proc:
      filter_dict:
        qa_value: {oper: '>=', value: 0.5}       # HCHO standard

  tropomi_l2_co:
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_co
    regrid_method: conservative
    regrid_target: [model]
    obs_grid_res: 0.1
    obs_grid_extent: [90, 135, 0, 45]
    obs_grid_units: deg
    filename: /glade/campaign/acom/satellite/tropomi/co/S5P_OFFL_L2__CO_____202402*.nc
    variables:
      qa_value: {}
      carbonmonoxide_total_column:
        ylabel_plot: 'CO column (molec cm$^{-2}$)'
        vmin_plot: 0
        vmax_plot: 3.0e+18
        nlevels_plot: 21
      column_averaging_kernel: {}
      pressure_levels: {}
      latitude_bounds: {}
      longitude_bounds: {}
      carbonmonoxide_total_column_precision: {}
      carbonmonoxide_total_column_corrected: {}
    data_proc:
      filter_dict:
        qa_value: {oper: '>=', value: 0.5}       # CO standard
        
#-------------------------------------------------------------------

plots:

  bx_dc8:
    type: 'boxplot'
    fig_kwargs:
      figsize: [8, 6]
    text_kwargs: {fontsize: 16.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc: {rem_obs_nan: true, set_axis: true}
    
  ts_dc8:
    type: 'timeseries'
    fig_kwargs: {figsize: [12, 6]}
    text_kwargs: {fontsize: 18.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc: {rem_obs_nan: true, ts_select_time: 'time', ts_avg_window: null, set_axis: false}

  vp_dc8:
    type: 'vertprofile'
    fig_kwargs: {figsize: [10, 14]}
    default_plot_kwargs: {linewidth: 4.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    ylabel_vert: 'Altitude (m)'              # top-level
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc:
      rem_obs_nan: True
      set_axis: False
      interquartile_style: 'shading'         # "box"
    altitude_variable: altitude              # top-level; your obs altitude (m)
    vertprofile_bins:                        # a DICT with range, not a list
      range:
        start: 0
        stop: 12000
        step: 1000

  scatter_dc8:
    type: 'scatter_density'
    fig_kwargs: {figsize: [10, 10]}
    default_plot_kwargs: {linewidth: 4.0, markersize: 10.}
    text_kwargs: {fontsize: 18.}
    domain_type: ['all']
    domain_name: ['DC8']
    data: ['dc8_cam-chem-se-merra2', 'dc8_cam-chem-se-era5']
    data_proc:
      rem_obs_nan: True
      set_axis: False        # set True + vmin_x/vmax_x/vmin_y/vmax_y to fix axes
    xlabel: 'Model'
    ylabel: 'Observation'
    title: 'DC8 Scatter Density'
    fill: True
    shade_lowest: True

